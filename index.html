<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<meta name="description" content="Premium cricket player auction game. Bid, build a 16-player squad, win.">
<title>Auction Arena · Cricket Player Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#060a13;--s1:#0d1424;--s2:#131c33;--s3:#1b2644;
  --line:rgba(148,163,210,.13);--line2:rgba(148,163,210,.26);
  --tx:#eef2fb;--mut:#97a3c0;--dim:#67738f;
  --pri:#3b82f6;--pri2:#8db8ff;--gold:#fbbf24;--gold2:#f59e0b;
  --ok:#22c55e;--bad:#f05252;--warn:#f59e0b;
  --wk:#2dd4bf;--bat:#60a5fa;--ar:#c084fc;--bowl:#fb923c;
  --r:14px;--r2:20px;
  --disp:'Barlow Condensed',Impact,'Arial Narrow',system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.5 var(--body);background:radial-gradient(1100px 600px at 85% -10%,rgba(59,130,246,.14),transparent 60%),radial-gradient(800px 480px at -10% 0,rgba(251,191,36,.07),transparent 55%),var(--bg);background-attachment:fixed;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--pri2);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.skip-link{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--gold);color:#111;padding:8px 12px;border-radius:8px}
.skip-link:focus{left:8px}
main:focus{outline:none}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 110px}
.narrow{max-width:680px}
h1,h2,h3{margin:0;font-family:var(--disp);letter-spacing:.02em;line-height:1.05;font-weight:800}
.h1{font-size:clamp(32px,5vw,44px);text-transform:uppercase}
.h2{font-size:22px;text-transform:uppercase;margin:28px 0 12px;letter-spacing:.06em}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.mut{color:var(--mut)}.dim{color:var(--dim)}.gold{color:var(--gold)}.okc{color:var(--ok)}.badc{color:#fca5a5}.tx{color:var(--tx)}
.small{font-size:13px}.tiny{font-size:12px}.center{text-align:center}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center}.wrap-row{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.gap6{gap:6px}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.glow{box-shadow:0 0 0 1px rgba(251,191,36,.07),0 24px 60px -24px rgba(59,130,246,.45)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);color:var(--tx);font-weight:600;cursor:pointer;transition:transform .12s,background .15s,border-color .15s,opacity .15s;white-space:nowrap;user-select:none;text-decoration:none}
.btn:hover{background:var(--s3);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn.busy{opacity:.7;pointer-events:none}
.btn.busy::after{content:'';width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn-pri{background:linear-gradient(180deg,#4f8ff7,#2f6fe0);border-color:transparent;color:#fff}
.btn-pri:hover{background:linear-gradient(180deg,#609bff,#3a7af0)}
.btn-gold{background:linear-gradient(180deg,#fcd34d,#f59e0b);border-color:transparent;color:#1a1204;font-weight:800}
.btn-gold:hover{background:linear-gradient(180deg,#fde68a,#fbbf24)}
.btn-ghost{background:transparent}
.btn-bad{background:rgba(240,82,82,.1);border-color:rgba(240,82,82,.4);color:#fca5a5}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn-xl{min-height:62px;padding:14px 38px;font-size:24px;font-family:var(--disp);letter-spacing:.1em;border-radius:16px}
.btn-block{width:100%}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
.input{width:100%;min-height:46px;padding:10px 14px;background:#070c18;border:1px solid var(--line2);border-radius:12px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--dim);margin-top:5px}
.form-err{color:#fecaca;background:rgba(240,82,82,.1);border:1px solid rgba(240,82,82,.35);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:14px}
.form-err:empty{display:none}
.form-ok{color:#bbf7d0;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);padding:12px;border-radius:10px}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;line-height:1.7;white-space:nowrap}
.r-wk{color:var(--wk)}.r-bat{color:var(--bat)}.r-ar{color:var(--ar)}.r-bowl{color:var(--bowl)}
.t-elite{color:var(--gold)}.t-star{color:#f472b6}.t-strong{color:var(--pri2)}.t-emerging{color:var(--ok)}.t-prospect{color:var(--mut)}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--s3);color:var(--mut);white-space:nowrap}
.st-live{background:rgba(34,197,94,.15);color:#86efac}.st-lobby{background:rgba(59,130,246,.15);color:var(--pri2)}.st-completed{background:rgba(251,191,36,.14);color:var(--gold)}.st-cancelled{background:rgba(240,82,82,.12);color:#fca5a5}
.list>*+*{margin-top:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.item.unread{border-color:rgba(251,191,36,.4)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--s3);flex:none;position:relative;font-family:var(--disp);font-size:18px;color:var(--tx)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av.lg{width:72px;height:72px;font-size:30px}
.dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--s1);background:var(--dim)}
.dot.on{background:var(--ok)}
.empty{text-align:center;padding:26px 16px;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.spinner{width:30px;height:30px;border:3px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.loading{padding:70px 16px;text-align:center;color:var(--mut)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- top bar / bottom nav ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(6,10,19,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx);cursor:pointer;background:none;border:0;padding:0}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-style:normal;color:#1a1204;font-size:17px;box-shadow:0 6px 18px -6px rgba(251,191,36,.6)}
.topnav{display:flex;gap:2px;margin-left:14px}
.topnav button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--mut);font-weight:600;cursor:pointer}
.topnav button:hover{color:var(--tx)}
.topnav button[aria-current=page]{color:var(--tx);background:var(--s2)}
.topnav .ic{display:none}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;cursor:pointer;font-size:18px;padding:0}
.icon-btn .av{width:30px;height:30px;font-size:14px}
.count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.count:empty{display:none}
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(8,12,22,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.botnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;border-radius:10px;min-height:48px}
.botnav .ic{font-size:19px;line-height:1.2}
.botnav button[aria-current=page]{color:var(--gold)}
@media(max-width:820px){.topnav{display:none}.botnav{display:grid}.topbar{padding:8px 12px}.brand .full{display:none}}
body.in-live .botnav{display:none!important}

/* ---------- toasts / overlay / modal ---------- */
.toasts{position:fixed;z-index:70;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px));pointer-events:none}
@media(max-width:820px){.toasts{left:12px;right:12px;width:auto;bottom:auto;top:64px}}
.toast{pointer-events:auto;padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.45);font-size:14px;animation:tin .22s ease-out}
.toast.ok{border-color:rgba(34,197,94,.5)}.toast.error{border-color:rgba(240,82,82,.55)}.toast.warn{border-color:rgba(245,158,11,.55)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.overlay{position:fixed;inset:0;z-index:55;display:grid;place-content:center;text-align:center;padding:20px;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at center,rgba(6,10,19,.82),rgba(6,10,19,.45))}
.overlay.show{opacity:1}
.stamp{display:inline-block;font-family:var(--disp);font-weight:800;font-size:clamp(64px,15vw,150px);letter-spacing:.08em;line-height:1;transform:rotate(-6deg);padding:4px 28px;border:6px solid currentColor;border-radius:18px;margin:0 auto 18px;animation:stamp .45s cubic-bezier(.2,1.5,.4,1)}
.overlay.sold .stamp{color:var(--gold);text-shadow:0 0 40px rgba(251,191,36,.55)}
.overlay.unsold .stamp{color:#94a3b8}
.ov-name{font-family:var(--disp);font-size:clamp(28px,5vw,46px);font-weight:800;text-transform:uppercase}
.ov-sub{color:var(--mut);font-size:18px}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(3,6,12,.7)}
.modal-card{max-width:420px;width:100%}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important}

/* ---------- auth / home / play ---------- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.auth-card{width:100%;max-width:420px}
.auth-brand{text-align:center;margin-bottom:20px}
.auth-brand .brand{justify-content:center;font-size:30px;margin:0 auto 6px;cursor:default}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px}
.hero{position:relative;overflow:hidden;padding:clamp(24px,5vw,44px);border-radius:26px}
.hero::after{content:'';position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.22),transparent 65%);pointer-events:none}
.hero-title{font-size:clamp(40px,7.5vw,72px);text-transform:uppercase;margin:8px 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.facts span{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{text-align:left;cursor:pointer;padding:18px;border-radius:18px;background:var(--s1);border:1px solid var(--line);color:var(--tx);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--line2)}
.tile .ic{font-size:26px}
.tile b{display:block;font-family:var(--disp);font-size:21px;text-transform:uppercase;margin-top:8px;letter-spacing:.04em}
.tile small{color:var(--mut)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media(max-width:700px){.choice{grid-template-columns:1fr}}
.choice-card{text-align:left;cursor:pointer;padding:26px;border-radius:22px;border:1px solid var(--line2);color:var(--tx);background:radial-gradient(400px 200px at 100% 0,rgba(59,130,246,.18),transparent 60%),var(--s1);transition:transform .15s,border-color .15s}
.choice-card:hover{transform:translateY(-3px);border-color:rgba(251,191,36,.45)}
.choice-card .ic{font-size:34px}
.choice-card h2{font-size:30px;text-transform:uppercase;margin:12px 0 6px}
.choice-card p{margin:0;color:var(--mut)}
.check{cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--gold);flex:none}

/* ---------- lobby ---------- */
.code-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code{font-family:var(--disp);font-size:clamp(38px,8vw,54px);font-weight:800;letter-spacing:.22em;color:var(--gold);line-height:1}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.slot{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);min-width:0}
.slot.me{border-color:rgba(251,191,36,.45)}
.slot.empty-slot,.slot.bot{border-style:dashed;opacity:.8}
.slot b{display:block;font-family:var(--disp);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.ready{color:var(--ok);font-weight:700;font-size:12px}.notready{color:var(--warn);font-weight:700;font-size:12px}

/* ---------- live auction ---------- */
.live{max-width:1340px;margin:0 auto;padding:12px 14px 30px}
.live-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.live-title{font-family:var(--disp);font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.prog{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--gold));transition:width .4s}
.conn{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}
.conn.off{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.live-grid{display:grid;grid-template-columns:290px minmax(0,1fr) 310px;gap:14px;align-items:start}
.col-left,.col-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-center{min-width:0}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin-bottom:10px;font-family:var(--body);font-weight:700}
.stage{position:relative;overflow:hidden;border-radius:24px;padding:clamp(16px,2.4vw,26px);background:radial-gradient(700px 320px at 20% -10%,rgba(59,130,246,.22),transparent 60%),radial-gradient(400px 260px at 110% 110%,rgba(251,191,36,.1),transparent 60%),linear-gradient(180deg,#111a31,#0a1121);border:1px solid var(--line2);min-height:300px}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.pavatar{width:100px;height:100px;border-radius:26px;display:grid;place-items:center;font-family:var(--disp);font-size:42px;font-weight:800;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:2px solid currentColor}
.pname{font-size:clamp(30px,4.4vw,52px);text-transform:uppercase;margin:6px 0 4px;color:var(--tx);overflow-wrap:anywhere}
.ratings{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px}
.rt{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.rt span{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt b{display:block;font-family:var(--disp);font-size:26px;line-height:1.1}
.rt.big b{color:var(--gold)}
.rt i{display:block;height:4px;border-radius:9px;background:var(--s3);margin-top:4px;overflow:hidden}
.rt i>u{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.rt.big i>u{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bidzone{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:18px;padding:16px 18px;border-radius:18px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.timer{position:relative;width:104px;height:104px;flex:none}
.timer svg{transform:rotate(-90deg);display:block}
.t-bg{fill:none;stroke:var(--s3);stroke-width:8}
.t-fg{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .2s}
.timer.low .t-fg{stroke:var(--bad)}
.timer.brk .t-fg{stroke:var(--pri)}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:42px;font-weight:800}
.timer.low .tnum{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.curbid .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700}
.curbid .amt{font-family:var(--disp);font-size:clamp(40px,6vw,64px);font-weight:800;color:var(--gold);line-height:1;margin:2px 0}
.curbid .amt.none{color:var(--mut);font-size:clamp(30px,4vw,40px)}
.curbid.flash .amt{animation:flash .55s ease-out}
@keyframes flash{0%{transform:scale(1.14);text-shadow:0 0 34px rgba(251,191,36,.8)}}
.hb{font-size:15px;color:var(--mut)}
.actions{margin-top:14px}
.qbids{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbid{min-height:60px;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.02em;flex-direction:column;gap:0;line-height:1.1;padding:8px 6px}.qbid small{font-family:var(--body);font-size:11px;font-weight:600;opacity:.75;letter-spacing:0}.qbase{grid-column:1/-1}
.maxed{grid-column:1/-1;text-align:center;padding:16px;border-radius:12px;border:1px dashed var(--line2);color:var(--mut)}
.act-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.act-note{font-size:13px;color:var(--mut);min-height:20px}
.teamname{font-family:var(--disp);font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpis>div{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpis span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}

<script>
'use strict';
/* ===================== CONFIGURATION — EDIT ONLY THESE TWO VALUES ===================== */
const SUPABASE_URL = 'https://freyacmeobmwhgeqisxd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_AJGlnrrUad7ajlzJy_CTdg_eo1W74Ys';
/* Use the Project URL and the PUBLISHABLE (or legacy anon) key. NEVER the secret/service_role key. */
/* ===================================================================================== */

const CONFIGURED = /^https?:\/\//.test(SUPABASE_URL) && !SUPABASE_URL.includes('YOUR-PROJECT') &&
  SUPABASE_PUBLISHABLE_KEY.length > 20 && !SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR-');
const SQUAD_SIZE = 16;
const ROLES = [
  { role: 'Wicketkeeper', short: 'WK',   key: 'wk_count',   min: 1, max: 3, cls: 'wk' },
  { role: 'Batter',       short: 'BAT',  key: 'bat_count',  min: 4, max: 8, cls: 'bat' },

];
const TIER = { elite: 'Elite', star: 'Star', strong: 'Strong', emerging: 'Emerging', prospect: 'Prospect' };
const MSG = {
  NOT_AUTHENTICATED: 'Please log in again.',
  AUCTION_NOT_FOUND: 'Auction not found. Check the code and try again.',
  AUCTION_FULL: 'This auction is full.',
  AUCTION_ALREADY_STARTED: 'This auction has already started. New players cannot join.',
  AUCTION_NOT_JOINABLE: 'This auction cannot be joined.',
  AUCTION_NOT_IN_LOBBY: 'The auction is no longer in the lobby.',
  TEAM_NAME_TAKEN: 'That team name (or short name) is already used in this auction.',
  TEAM_NAME_LOCKED: 'Team names are locked once the auction starts.',
  INVALID_TEAM_NAME: 'Team name must be 2–30 characters.',
  INVALID_SHORT_NAME: 'Short name must be 2–5 letters or digits (e.g. MUM).',
  INVALID_AUCTION_NAME: 'Auction name must be 3–60 characters.',
  INVALID_HUMAN_PLAYERS: 'Human players must be between 2 and the total number of teams.',

  ONLY_HOST_CAN_START: 'Only the host can start the auction.',
  ONLY_HOST_CAN_INVITE: 'Only the host can invite players.',

  NEED_AT_LEAST_TWO_HUMANS: 'At least 2 human players must join before starting.',
  PLAYERS_NOT_READY: 'Everyone must be ready before the host can start.',
  CANNOT_CANCEL_IN_THIS_STATE: 'This auction can no longer be cancelled.',
  CANNOT_LEAVE_AFTER_START: 'You cannot leave after the auction starts — your team stays in it.',
  NOT_A_MEMBER: 'You are not a member of this auction.',
  NOT_A_TEAM_OWNER: 'You do not control a team in this auction.',
  CAN_ONLY_INVITE_FRIENDS: 'You can only invite friends.',
  CANNOT_INVITE_SELF: 'You cannot invite yourself.',

  TEAM_SKIPPED_PLAYER: 'You skipped this player, so you cannot bid.',
  INVALID_AMOUNT: 'That bid amount is not valid.',
  INVALID_BID_AMOUNT: 'Someone bid first — pick one of the new amounts.',
  NO_HIGHER_BID_POSSIBLE: 'The bid is already at the ₹5.00 Cr ceiling.',
  ABOVE_MAX_PLAYER_PRICE: 'Bids cannot exceed ₹5.00 Cr.',
  BID_NOT_HIGHER: 'Someone bid first — pick a higher amount.',
  BID_BELOW_MINIMUM: 'That bid is below the minimum.',
  SQUAD_FULL: 'Your squad already has 16 players.',
  INSUFFICIENT_PURSE: 'Not enough purse for this bid.',
  ROLE_LIMIT_REACHED: 'You already have the maximum players for this role.',
  ROLE_MINIMUMS_AT_RISK: 'This buy would leave too few slots to meet your role minimums.',
  PURSE_RESERVE_REQUIRED: 'You must keep enough purse to complete all 16 slots.',
  ALREADY_SKIPPED: 'You already skipped this player.',
  CANNOT_SKIP_WHILE_HIGHEST_BIDDER: 'You cannot skip while you are the highest bidder.',
  INVALID_REFERENCE: 'Something is out of sync. Reloading…'
};

let sb = null;
const S = {
  session: null, profile: null, setupFor: null, players: new Map(), playersPromise: null,
  route: null, routeToken: 0, viewTimers: [], viewChannels: [], notifChannel: null,
  unread: 0, room: null, hb: null, ready: false, recovery: false, ovTimer: null
};
let PREFS = { reduceMotion: false, debug: false, haptics: true };
try { Object.assign(PREFS, JSON.parse(localStorage.getItem('ca_prefs') || '{}')); } catch (e) { /* ignore bad prefs */ }
function savePrefs() { try { localStorage.setItem('ca_prefs', JSON.stringify(PREFS)); } catch (e) { /* ignore */ } applyPrefs(); }
function applyPrefs() { document.body.classList.toggle('reduce-motion', !!PREFS.reduceMotion); }
function log(...a) { if (PREFS.debug) console.log('%c[auction]', 'color:#fbbf24', ...a); }

/* ===================== UTILITIES ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n2 = v => Math.round(Number(v) * 100) / 100;
const cr = v => (v === null || v === undefined || v === '') ? '—' : '₹' + Number(v).toFixed(2) + ' Cr';
const range = (a, b) => Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => a + i);
const initials = s => String(s || '?').trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const maxBy = (arr, f) => arr.reduce((best, x) => (best === null || f(x) > f(best)) ? x : best, null);
const baseUrl = () => location.origin + location.pathname;
const roleMeta = r => ROLES.find(x => x.role === r) || ROLES[1];
function uerr(message) { const e = new Error(message); e.userMsg = true; return e; }
function timeAgo(ts) { const s = Math.max(0, (Date.now() - Date.parse(ts)) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
function dateFmt(ts) { try { return new Date(ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ''; } }
function fairValue(overall, base, max) { const q = Math.min(Math.max((Number(overall) - 72) / 24, 0), 1); return n2(Number(base) + Math.max(Number(max) - Number(base), 0) * Math.pow(q, 1.6)); }

/* Bid rule — identical to app_private.quick_bid_options(): first bid = base (or base + step), then current + 0.25/0.50/0.75/1/2/5 Cr. No price cap. */
const BID_STEPS = [0.25, 0.5, 0.75, 1, 2, 5];
function quickBidOptions(base, current) {
  base = n2(base);
  const has = current !== null && current !== undefined;
  const cur = has ? n2(current) : null;
  const raw = has ? BID_STEPS.map(s => cur + s) : [base, ...BID_STEPS.map(s => base + s)];
  return [...new Set(raw.map(v => n2(v)))].sort((a, b) => a - b);
}
/* Mirror of app_private.team_acquire_block_reason() — used only to disable buttons; server decides. */
function blockReason(team, role, price, reserve) {
  const count = Number(team.squad_count) || 0, purse = Number(team.remaining_purse_cr) || 0;
  if (count >= SQUAD_SIZE) return 'SQUAD_FULL';
  if (price > purse + 1e-9) return 'INSUFFICIENT_PURSE';
  const slotsAfter = SQUAD_SIZE - count - 1; let needed = 0;
  for (const r of ROLES) { const c = (Number(team[r.key]) || 0) + (r.role === role ? 1 : 0); if (c > r.max) return 'ROLE_LIMIT_REACHED'; needed += Math.max(r.min - c, 0); }
  if (needed > slotsAfter) return 'ROLE_MINIMUMS_AT_RISK';
  if (purse - price < slotsAfter * (reserve || 0) - 1e-9) return 'PURSE_RESERVE_REQUIRED';
  return null;
}
function avatarHTML(name, url, online, cls = '') {
  const dot = (online === null || online === undefined) ? '' : `<span class="dot ${online ? 'on' : ''}" aria-label="${online ? 'Online' : 'Offline'}"></span>`;
  const inner = url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : esc(initials(name));
  return `<span class="av ${cls}">${inner}${dot}</span>`;
}

/* ===================== UI HELPERS ===================== */
function setView(html) { $('#view').innerHTML = html; }
const alive = t => t === undefined || t === S.routeToken;
function toast(msg, type = 'info', ms = 3800) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg; box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => el.remove(), ms);
}
function setBusy(el, on) { if (!el) return; el.classList.toggle('busy', !!on); el.setAttribute('aria-busy', on ? 'true' : 'false'); }
const loadingHTML = (txt = 'Loading…') => `<div class="loading"><div class="spinner" aria-hidden="true"></div>${esc(txt)}</div>`;
const errorHTML = msg => `<div class="wrap narrow"><div class="card center"><h2 class="h2" style="margin-top:0">Couldn't load this</h2><p class="mut">${esc(msg)}</p><button class="btn btn-pri" data-action="retry" data-busy="no">Try again</button></div></div>`;
function friendly(err) {
  if (!err) return 'Something went wrong.';
  if (err.userMsg) return err.message;
  const m = String(err.message || err.code || err);
  if (MSG[m]) return MSG[m];
  const key = Object.keys(MSG).find(k => m.includes(k));
  if (key) return MSG[key];
  if (/Failed to fetch|NetworkError|network|Load failed/i.test(m)) return 'Network problem. Check your connection and try again.';
  if (/JWT|expired/i.test(m)) return 'Your session expired. Please log in again.';
  if (err.code === '42501') return "You don't have permission to do that.";
  if (err.code === '23505') return 'That already exists.';
  log('Unmapped error', err);
  return 'Something went wrong. Please try again.';
}
function errText(err) { if (err && String(err.name || '').includes('Auth') && err.message) return err.message; return friendly(err); }
function confirmBox(msg, ok = 'Confirm', danger = false) {
  return new Promise(resolve => {
    const m = $('#modal'); m.hidden = false;
    m.innerHTML = `<div class="modal-card card" role="dialog" aria-modal="true" aria-labelledby="m-title"><p id="m-title" style="margin:0 0 16px">${esc(msg)}</p><div class="row end"><button class="btn btn-ghost" data-m="0">Cancel</button><button class="btn ${danger ? 'btn-bad' : 'btn-pri'}" data-m="1">${esc(ok)}</button></div></div>`;
    const done = v => { m.hidden = true; m.innerHTML = ''; m.onclick = null; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    m.onclick = e => { const b = e.target.closest('[data-m]'); if (b) done(b.dataset.m === '1'); else if (e.target === m) done(false); };
    m.querySelector('[data-m="1"]').focus();
  });
}

/* ===================== DATA ===================== */
async function rpc(fn, params = {}) {
  const { data, error } = await sb.rpc(fn, params);
  if (error) { log('rpc error', fn, error); throw error; }
  return data;
}
function ensurePlayers() {
  if (S.players.size) return Promise.resolve();
  if (!S.playersPromise) {
    S.playersPromise = sb.from('players').select('*').order('player_id').then(({ data, error }) => {
      if (error) { S.playersPromise = null; throw error; }

  return S.playersPromise;

/* ===================== ROUTER ===================== */
const PUBLIC = new Set(['login', 'signup', 'forgot', 'reset']);
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');

  const [path, qs] = h.split('?');
  const [name, ...rest] = path.split('/');
  return { name: name || 'home', params: rest, query: new URLSearchParams(qs || '') };
}
function go(path) { const h = '#/' + path; if (location.hash === h) route(); else location.hash = h; }
function cleanupView() {
  S.viewTimers.forEach(clearInterval); S.viewTimers = [];
  if (sb) S.viewChannels.forEach(ch => sb.removeChannel(ch));
  S.viewChannels = []; S.room = null;
  document.body.classList.remove('in-live');

async function route() {
  if (!S.ready) return;
  const r = parseHash(); if (!r) return;
  if (!S.session && !PUBLIC.has(r.name)) { go('login'); return; }
  if (S.session && PUBLIC.has(r.name) && !(r.name === 'reset' && S.recovery)) { go('home'); return; }
  cleanupView();
  const t = ++S.routeToken; S.route = r;
  renderChrome();
  window.scrollTo(0, 0);
  const fn = VIEWS[r.name] || viewNotFound;
  try { await fn(r, t); }
  catch (e) { log('view error', e); if (alive(t)) setView(errorHTML(friendly(e))); }
}
function renderChrome() {
  const tb = $('#topbar'), bn = $('#botnav');
  if (!S.session || !S.route || PUBLIC.has(S.route.name)) { tb.hidden = true; bn.hidden = true; return; }
  tb.hidden = false; bn.hidden = false;
  const n = S.route.name;
  const cur = n === 'a' ? 'my-auctions' : ['multi', 'create', 'join'].includes(n) ? 'play' : n;
  const nb = (to, ic, label) => `<button data-action="nav" data-to="${to}" data-busy="no" ${cur === to ? 'aria-current="page"' : ''}><span class="ic" aria-hidden="true">${ic}</span><span>${label}</span></button>`;
  const p = S.profile || {};
  tb.innerHTML = `<button class="brand" data-action="nav" data-to="home" data-busy="no" aria-label="Auction Arena home"><i aria-hidden="true">₹</i><span class="full">Auction Arena</span></button>
    <nav class="topnav" aria-label="Main">${nb('home', '🏠', 'Home')}${nb('play', '▶️', 'Play')}${nb('my-auctions', '🏆', 'My Auctions')}${nb('friends', '👥', 'Friends')}</nav>
    <div class="top-right">

async function onAuth(event, session) {
  log('auth event', event);
  S.session = session;
  if (event === 'SIGNED_OUT') { teardownUser(); S.recovery = false; if (S.ready) { renderChrome(); go('login'); } return; }
  if (event === 'PASSWORD_RECOVERY') S.recovery = true;
  if (session) await setupUser();
  if (event === 'INITIAL_SESSION') {
    S.ready = true;
    const h = location.hash;
    if (/error_description=/.test(h)) {
      const m = decodeURIComponent(((h.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g, ' '));
      history.replaceState(null, '', baseUrl() + '#/login');
      if (m) toast(m, 'error', 6000);
    } else if (/access_token=|type=recovery/.test(h)) {
      history.replaceState(null, '', baseUrl() + (S.recovery ? '#/reset' : '#/home'));
    }
    route(); return;
  }
  if (event === 'PASSWORD_RECOVERY') { go('reset'); return; }
  if (event === 'SIGNED_IN' && S.ready) {
    const r = parseHash();
    if (!r || (PUBLIC.has(r.name) && !(r.name === 'reset' && S.recovery))) go('home');
  }
}
async function setupUser() {
  const uid = S.session.user.id;
  if (S.setupFor === uid) return;
  S.setupFor = uid;
  const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (error) log('profile load', error);
  S.profile = data || null;
  ensurePlayers().catch(e => log('players', e));
  if (S.notifChannel) sb.removeChannel(S.notifChannel);
  S.notifChannel = sb.channel('notif-' + uid)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `recipient_id=eq.${uid}` }, p => {
      const n = p.new || {}; S.unread++; updateBell();
      if (S.route && S.route.name === 'notifications') loadNotifications().catch(e => log(e));
      else toast(`${n.title || 'Notification'}: ${n.message || ''}`, 'info', 5000);
    })
    .subscribe(st => log('notif channel', st));
  refreshNotifCount().catch(e => log(e));
  heartbeat(); clearInterval(S.hb); S.hb = setInterval(heartbeat, 45000);
  renderChrome();
}
function teardownUser() {
  clearInterval(S.hb); S.hb = null;

/* Server is authoritative: the client only nudges the idempotent tick (also works without pg_cron). */
async function liveHeartbeat() {
  const R = S.room; if (!R || R.rendered !== 'live' || R.auction.status !== 'live' || R.ticking) return;
  const ap = currentAp(), now = serverNow(), ends = ap ? Date.parse(ap.timer_ends_at) : 0, due = !ap || now >= ends;
  const since = Date.now() - (R.lastTick || 0);
  if ((!due && since < 1500) || (due && since < 700)) return;
  R.ticking = true; R.lastTick = Date.now();
  try { await rpc('auction_tick', { p_auction_id: R.id }); } catch (e) { log('tick', e); }
  finally { R.ticking = false; }
  if (ap && now > ends + 3500 && Date.now() - (R.lastReload || 0) > 4000 && currentAp() === ap) { R.lastReload = Date.now(); reloadRoom(); }
}

/* ---------- realtime handlers ---------- */
function onAuctionRow(p) {
  const R = S.room; if (!R || !p.new || p.new.id !== R.id) return;
  const prevStatus = R.auction.status, prevCur = R.auction.current_auction_player_id;
  R.auction = Object.assign({}, R.auction, p.new);
  if (R.auction.status !== prevStatus) { reloadRoom(); return; }
  if (R.auction.status === 'live') {
    if (prevCur !== R.auction.current_auction_player_id) { R.skips = []; R.phase = null; if (!R.aps.get(R.auction.current_auction_player_id)) reloadRoom(); }
    scheduleLive();
  } else if (R.auction.status === 'lobby') debouncedReload();
}
function onApRow(p) {
  const R = S.room, row = p.new; if (!R || !row || !row.id || row.auction_id !== R.id) return;
  const old = R.aps.get(row.id); R.aps.set(row.id, row);
  if (R.rendered !== 'live') return;
  if (row.status === 'current') {
    if (R.auction.current_auction_player_id !== row.id) { R.auction.current_auction_player_id = row.id; R.skips = []; R.phase = null; }
    if (old && Number(row.bid_count) > Number(old.bid_count || 0) && row.highest_team_id !== R.myTeamId) {
      const tm = R.teams.get(row.highest_team_id);
      pushFeed(`<b>${esc((tm && (tm.short_name || tm.team_name)) || 'A team')}</b> bid ${cr(row.current_bid_cr)}`);
    }
    if (!old || Number(row.bid_count) !== Number(old.bid_count || 0)) R.flashBid = true;
    scheduleLive();
  } else if ((row.status === 'sold' || row.status === 'unsold') && old && old.status === 'current') {
    const pl = S.players.get(row.player_id) || {}, tm = R.teams.get(row.sold_team_id);
    if (row.status === 'sold') {
      if (!R.squads.some(s => s.auction_player_id === row.id)) R.squads.push({ team_id: row.sold_team_id, player_id: row.player_id, auction_player_id: row.id, purchase_price_cr: row.sold_price_cr, role: pl.role });
      pushFeed(`<b class="gold">SOLD</b> ${esc(pl.player_name)} → ${esc((tm && tm.team_name) || '')} · ${cr(row.sold_price_cr)}`);
    } else pushFeed(`<b class="dim">UNSOLD</b> ${esc(pl.player_name)}`);
    showResultOverlay(row); scheduleLive();
  } else scheduleLive();
}
function onTeamRow(p) {
  const R = S.room; if (!R) return;
  if (p.eventType === 'DELETE') { const id = p.old && p.old.id; if (id && R.teams.has(id)) { R.teams.delete(id); debouncedReload(); } return; }
  const row = p.new; if (!row || row.auction_id !== R.id) return;
  R.teams.set(row.id, row);
  if (R.rendered === 'live') scheduleLive(); else if (R.rendered === 'lobby') debouncedReload();
}
function onSkip(p) {
  const R = S.room, s = p.new; if (!R || !s || s.auction_id !== R.id) return;
  if (s.auction_player_id !== R.auction.current_auction_player_id) return;
  if (!R.skips.some(x => x.team_id === s.team_id)) R.skips.push(s);
  if (s.team_id !== R.myTeamId) {

    toast(`${nm} wants to skip this player.`, 'info', 3000);

  }
  scheduleLive();
}

async function viewFriends(r, t) {
  setView(`<div class="wrap narrow"><h1 class="h1">Friends</h1>

async function loadFriendsData(t) {
  const me = S.session.user.id;
  const [friends, reqs] = await Promise.all([rpc('get_my_friends'), sb.from('friend_requests').select('id,sender_id,receiver_id,created_at').eq('status', 'pending').order('created_at', { ascending: false })]);
  if (reqs.error) throw reqs.error;
  if (!alive(t) || !S.route || S.route.name !== 'friends') return;
  const rows = reqs.data || [];
  const ids = [...new Set(rows.map(q => q.sender_id === me ? q.receiver_id : q.sender_id))];
  let prof = new Map();
  if (ids.length) { const { data, error } = await sb.from('profiles').select('id,display_name,avatar_url').in('id', ids); if (error) throw error; prof = new Map((data || []).map(p => [p.id, p])); }
  const inc = rows.filter(q => q.receiver_id === me), out = rows.filter(q => q.sender_id === me);
  const reqItem = (q, incoming) => { const p = prof.get(incoming ? q.sender_id : q.receiver_id) || {};
    return `<div class="item">${avatarHTML(p.display_name, p.avatar_url)}<div class="grow"><b class="ell" style="display:block">${esc(p.display_name || 'Player')}</b><div class="tiny mut">${incoming ? 'Wants to be friends' : 'Request sent'} · ${timeAgo(q.created_at)}</div></div>${incoming
      ? `<button class="btn btn-sm btn-gold" data-action="fr-respond" data-id="${q.id}" data-accept="1">Accept</button><button class="btn btn-sm btn-ghost" data-action="fr-respond" data-id="${q.id}" data-accept="0">Decline</button>`
      : `<button class="btn btn-sm btn-ghost" data-action="fr-cancel" data-id="${q.id}">Cancel</button>`}</div>`; };
  const rq = $('#fr-reqs'), fl = $('#fr-list'); if (!rq || !fl) return;
  rq.innerHTML = (inc.length ? `<h2 class="h2">Friend requests</h2><div class="list">${inc.map(q => reqItem(q, true)).join('')}</div>` : '') + (out.length ? `<h2 class="h2">Sent requests</h2><div class="list">${out.map(q => reqItem(q, false)).join('')}</div>` : '');
  fl.innerHTML = (friends || []).length ? friends.map(f => `<div class="item">${avatarHTML(f.display_name, f.avatar_url, f.is_online)}<div class="grow"><b class="ell" style="display:block">${esc(f.display_name)}</b><div class="tiny ${f.is_online ? 'okc' : 'mut'}">${f.is_online ? 'Online' : 'Offline · last seen ' + timeAgo(f.last_seen_at)}</div></div><button class="btn btn-sm btn-ghost" data-action="fr-remove" data-id="${f.friend_id}" data-name="${esc(f.display_name)}">Remove</button></div>`).join('')
    : '<div class="empty">No friends yet. Search above to add players.</div>';
}
function relBtn(u) {
  if (u.relationship === 'friend') return '<span class="pill okc">Friends</span>';
  if (u.relationship === 'request_sent') return '<span class="pill">Requested</span>';

  return `<button class="btn btn-sm btn-pri" data-action="fr-add" data-id="${u.user_id}">Add friend</button>`;
}

INPUTS['friend-search'] = debounce(async el => {

async function loadNotifications(t) {

  if (error) throw error;
  if (!alive(t) || !S.route || S.route.name !== 'notifications') return;
  const list = data || [];
  const invIds = list.filter(n => n.type === 'auction_invite' && n.related_entity_id).map(n => n.related_entity_id);
  const frIds = list.filter(n => n.type === 'friend_request' && n.related_entity_id).map(n => n.related_entity_id);
  const [inv, fr] = await Promise.all([
    invIds.length ? sb.from('auction_invitations').select('id,status').in('id', invIds) : Promise.resolve({ data: [] }),
    frIds.length ? sb.from('friend_requests').select('id,status').in('id', frIds) : Promise.resolve({ data: [] })]);
  const pend = new Set([...((inv && inv.data) || []), ...((fr && fr.data) || [])].filter(x => x.status === 'pending').map(x => x.id));
  const icon = { friend_request: '🤝', friend_accepted: '✅', auction_invite: '📨', auction_invite_declined: '🚫', auction_started: '🔴', auction_completed: '🏆', auction_cancelled: '⛔', system: '🔔' };
  const box = $('#nt-list'); if (!box) return;
  box.innerHTML = list.length ? list.map(n => `<div class="item ${n.is_read ? '' : 'unread'}" style="align-items:flex-start"><span class="av" aria-hidden="true">${icon[n.type] || '🔔'}</span><div class="grow"><b>${esc(n.title)}</b><div class="small mut">${esc(n.message)}</div><div class="tiny dim">${timeAgo(n.created_at)}</div>${ntActions(n, pend)}</div><button class="btn btn-sm btn-ghost" data-action="nt-del" data-id="${n.id}" aria-label="Delete notification">✕</button></div>`).join('')
    : '<div class="empty">You are all caught up.</div>';
  if (list.some(n => !n.is_read)) rpc('mark_notifications_read', { p_ids: null }).then(() => { S.unread = 0; updateBell(); }).catch(e => log(e));
}
function ntActions(n, pend) {
  if (n.type === 'friend_request' && pend.has(n.related_entity_id)) return `<div class="row mt8"><button class="btn btn-sm btn-gold" data-action="nt-friend" data-id="${n.related_entity_id}" data-accept="1">Accept</button><button class="btn btn-sm btn-ghost" data-action="nt-friend" data-id="${n.related_entity_id}" data-accept="0">Decline</button></div>`;
  if (n.type === 'auction_invite' && pend.has(n.related_entity_id)) return `<form class="mt8" data-form="invite-accept" novalidate><div class="form-err" role="alert"></div><input type="hidden" name="inv" value="${n.related_entity_id}"><div class="grid2"><input class="input" name="team_name" placeholder="Your team name" required minlength="2" maxlength="30" aria-label="Team name"><input class="input" name="short_name" placeholder="Short (optional)" maxlength="5" aria-label="Short name"></div><div class="row mt8"><button class="btn btn-sm btn-gold" type="submit">Accept & join lobby</button><button class="btn btn-sm btn-ghost" type="button" data-action="inv-decline" data-id="${n.related_entity_id}">Decline</button></div></form>`;
  if (n.auction_id && ['auction_started', 'auction_completed', 'auction_invite_declined'].includes(n.type)) return `<div class="mt8"><button class="btn btn-sm" data-action="nav" data-to="a/${n.auction_id}" data-busy="no">Open auction</button></div>`;
  return '';
}
ACTIONS['nt-friend'] = async el => { await rpc('respond_friend_request', { p_request_id: el.dataset.id, p_accept: el.dataset.accept === '1' }); toast(el.dataset.accept === '1' ? 'Friend added.' : 'Request declined.', 'ok'); await loadNotifications(); };
ACTIONS['inv-decline'] = async el => { await rpc('respond_auction_invitation', { p_invitation_id: el.dataset.id, p_accept: false }); toast('Invitation declined.', 'ok'); await loadNotifications(); };
ACTIONS['nt-del'] = async el => { const { error } = await sb.from('notifications').delete().eq('id', el.dataset.id); if (error) throw error; const it = el.closest('.item'); if (it) it.remove(); };
FORMS['invite-accept'] = async d => {
  const team = (d.team_name || '').trim(), short = (d.short_name || '').trim().toUpperCase();
  if (team.length < 2) throw uerr('Enter your team name (2–30 characters).');
  if (short && !/^[A-Z0-9]{2,5}$/.test(short)) throw uerr('Short name must be 2–5 letters or digits.');
  const res = await rpc('respond_auction_invitation', { p_invitation_id: d.inv, p_accept: true, p_team_name: team, p_short_name: short || null });
  go('a/' + res.auction_id);
};

/* ===================== MY AUCTIONS / PROFILE / SETTINGS ===================== */
async function viewMyAuctions(r, t) {
  setView(`<div class="wrap"><div class="row between wrap-row"><h1 class="h1">My Auctions</h1><button class="btn btn-gold" data-action="nav" data-to="play" data-busy="no">▶ New auction</button></div><div id="ma">${loadingHTML()}</div></div>`);
  const list = (await rpc('get_my_auctions')) || []; if (!alive(t)) return;
  const act = list.filter(a => a.status === 'live' || a.status === 'lobby'), done = list.filter(a => a.status === 'completed' || a.status === 'cancelled');
  $('#ma').innerHTML = `<h2 class="h2">Active</h2>${act.length ? `<div class="list">${act.map(auctionCard).join('')}</div>` : '<div class="empty">No active auctions. Start one from Play.</div>'}
    <h2 class="h2">Completed</h2>${done.length ? `<div class="list">${done.map(auctionCard).join('')}</div>` : '<div class="empty">No completed auctions yet.</div>'}`;
}
async function viewProfile(r, t) {
  const p = S.profile || {};
  setView(`<div class="wrap narrow"><h1 class="h1">Profile</h1>
    <div class="card mt"><div class="row">${avatarHTML(p.display_name, p.avatar_url, null, 'lg')}<div class="grow"><div class="teamname" style="margin:0">${esc(p.display_name || 'Player')}</div><div class="small mut ell">${esc(S.session.user.email)}</div></div></div>
      <div class="stats mt" id="pf-stats">${['Auctions', 'Completed', 'Wins', 'Best score'].map(x => `<div class="stat"><span>${x}</span><b>—</b></div>`).join('')}</div></div>
    <form class="card mt" data-form="profile" novalidate><h2 class="h2" style="margin-top:0">Edit profile</h2><div class="form-err" role="alert"></div>
      <label class="field"><span>Display name</span><input class="input" name="display_name" required minlength="3" maxlength="24" value="${esc(p.display_name || '')}"></label>
      <label class="field"><span>Avatar image URL (optional, https)</span><input class="input" name="avatar_url" type="url" maxlength="500" placeholder="https://…" value="${esc(p.avatar_url || '')}"></label>
      <button class="btn btn-pri" type="submit">Save changes</button></form>
    <button class="btn btn-bad btn-block mt" data-action="logout">Log out</button></div>`);
  try {
    const list = (await rpc('get_my_auctions')) || []; if (!alive(t)) return;
    const comp = list.filter(a => a.status === 'completed'), wins = comp.filter(a => a.my_rank === 1).length;
    const best = comp.reduce((m, a) => Math.max(m, Number(a.my_total_score) || 0), 0);
    const el = $('#pf-stats'); if (el) el.innerHTML = `<div class="stat"><span>Auctions</span><b>${list.length}</b></div><div class="stat"><span>Completed</span><b>${comp.length}</b></div><div class="stat"><span>Wins</span><b class="gold">${wins}</b></div><div class="stat"><span>Best score</span><b>${comp.length ? best.toFixed(1) : '—'}</b></div>`;
  } catch (e) { log(e); }
}
FORMS.profile = async d => {
  const name = (d.display_name || '').trim(), url = (d.avatar_url || '').trim();
  if (name.length < 3 || name.length > 24) throw uerr('Display name must be 3–24 characters.');
  if (url && !/^https:\/\//i.test(url)) throw uerr('Avatar URL must start with https://');
  const { data, error } = await sb.from('profiles').update({ display_name: name, avatar_url: url || null }).eq('id', S.session.user.id).select().single();
  if (error) { if (error.code === '23505') throw uerr('That display name is already taken.'); throw error; }
  S.profile = data; renderChrome(); toast('Profile saved.', 'ok'); viewProfile(S.route, S.routeToken);
};
function viewSettings() {
  let host = ''; try { host = new URL(SUPABASE_URL).host; } catch (e) { host = SUPABASE_URL; }
  const tg = (key, title, sub) => `<label class="toggle"><span><b>${title}</b><div class="small mut">${sub}</div></span><input type="checkbox" data-change="pref" data-key="${key}" ${PREFS[key] ? 'checked' : ''}></label>`;
  setView(`<div class="wrap narrow"><h1 class="h1">Settings</h1>
    <div class="card mt">${tg('reduceMotion', 'Reduce motion', 'Minimise animations, including SOLD / UNSOLD effects.')}${tg('haptics', 'Haptic feedback', 'Vibrate on bids and wins (supported phones).')}${tg('debug', 'Developer logs', 'Print debug information to the browser console.')}
      <div class="toggle" style="border:0;cursor:default"><span><b>Server</b><div class="small mut ell">${esc(host)}</div></span></div></div>
    <div class="card mt"><b>Game rules</b><ul class="small mut" style="margin:8px 0 0;padding-left:18px;line-height:1.8">
      <li>Every team starts with ₹100 Cr. There is no maximum price per player — only your purse limits your bid (you must keep enough to complete 16 players).</li>
      <li>Squads have exactly 16 players: WK 1–3, BAT 4–8, AR 2–6, BOWL 4–8.</li>
      <li>Each player starts with 15 seconds. Every successful bid resets the timer to 15 seconds.</li>
      <li>Quick bids: first bid at base price, then +₹0.25, +₹0.50, +₹0.75, +₹1, +₹2 or +₹5 Cr.</li>
      <li>Skipping a player removes only your team from that player's bidding.</li>
      <li>Final score (100): Strength 50 · Balance 25 · Value 15 · Budget 10. Complete squads rank first.</li></ul></div>
    <button class="btn btn-bad btn-block mt" data-action="logout">Log out</button></div>`);
}
CHANGES.pref = el => { PREFS[el.dataset.key] = el.checked; savePrefs(); toast('Setting saved.', 'ok', 1500); };
function viewNotFound() { setView(`<div class="wrap narrow"><div class="card center"><h1 class="h1">Page not found</h1><p class="mut">That screen doesn't exist.</p><button class="btn btn-pri" data-action="nav" data-to="home" data-busy="no">Go home</button></div></div>`); }
function renderSetup(cdnFailed) {
  setView(`<div class="auth-wrap"><div class="card glow" style="max-width:620px"><div class="brand" style="cursor:default"><i>₹</i>Auction Arena</div>
    <h1 class="h1 mt">${cdnFailed ? 'Could not load Supabase' : 'Setup required'}</h1>
    ${cdnFailed ? '<p class="mut">The Supabase library failed to load. Check your internet connection and reload.</p>'
      : `<p class="mut">Connect this game to your Supabase project:</p><ol class="small" style="padding-left:18px;line-height:1.9"><li>Supabase Dashboard → <b>Project Settings → API Keys</b>.</li><li>Copy the <b>Project URL</b> and the <b>publishable</b> key (or legacy <b>anon</b> key).</li><li>Open <code>index.html</code>, find the <b>CONFIGURATION</b> block at the top of the script, and paste both values.</li><li>Never paste the <b>secret</b> or <b>service_role</b> key.</li></ol>`}
    <button class="btn btn-pri mt" onclick="location.reload()">Reload</button></div></div>`);
}

/* ===================== EVENT DELEGATION (one listener each, no duplicates) ===================== */
const VIEWS = { login: viewLogin, signup: viewSignup, forgot: viewForgot, reset: viewReset, home: viewHome, play: viewPlay, multi: viewMulti, create: viewCreate, join: viewJoin, a: viewAuctionRoom, friends: viewFriends, notifications: viewNotifications, 'my-auctions': viewMyAuctions, profile: viewProfile, settings: viewSettings };
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  e.preventDefault();
  if (el.disabled || el.classList.contains('busy')) return;
  const busy = el.dataset.busy !== 'no';
  if (busy) setBusy(el, true);
  try { await fn(el); } catch (err) { log('action', el.dataset.action, err); toast(friendly(err), 'error'); }
  finally { if (busy && el.isConnected) setBusy(el, false); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btn = f.querySelector('[type=submit]'); if (btn && btn.classList.contains('busy')) return;
  const errBox = f.querySelector('.form-err'); if (errBox) errBox.textContent = '';
  setBusy(btn, true);
  try { await fn(Object.fromEntries(new FormData(f)), f); }
  catch (err) { log('form', f.dataset.form, err); if (errBox && errBox.isConnected) errBox.textContent = errText(err); else toast(errText(err), 'error'); }
  finally { if (btn && btn.isConnected) setBusy(btn, false); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e); });

/* ===================== BOOT ===================== */
function boot() {
  applyPrefs();
  const lib = window.supabase && window.supabase.createClient;
  if (!CONFIGURED || !lib) { renderSetup(CONFIGURED && !lib); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  setView(loadingHTML('Starting…'));
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => { onAuth(event, session).catch(e => log('auth handler', e)); }, 0); });
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    heartbeat();
    if (S.room && S.room.auction && S.room.auction.status !== 'completed') reloadRoom();
  });
  window.addEventListener('online', () => { toast('Back online.', 'ok'); if (S.room) reloadRoom(); });
  window.addEventListener('offline', () => toast('You are offline. The game will resync when you reconnect.', 'warn', 5000));
}
boot();
</script>
